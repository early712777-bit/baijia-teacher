<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>你的百家老師</title>
</head>

<body style="background:#020b2d;color:white;text-align:center;font-family:sans-serif">

<h1>你的百家老師</h1>

<button onclick="add('B')" style="padding:20px;background:red;color:white">莊</button>
<button onclick="add('P')" style="padding:20px;background:blue;color:white">閒</button>

<br><br>

<button onclick="reset()">重置</button>

<h2>大路</h2>
<div id="road"></div>

<h2 id="predict">下一局預測：-</h2>

<script>

let history=[];

function add(x){
history.push(x);
draw();
predict();
}

function draw(){
let road=document.getElementById("road");
road.innerHTML="";
history.forEach(v=>{
let d=document.createElement("span");
d.style.width="20px";
d.style.height="20px";
d.style.display="inline-block";
d.style.borderRadius="50%";
d.style.margin="3px";
d.style.background=v==="B"?"red":"blue";
road.appendChild(d);
});
}

function predict(){
let banker=history.filter(x=>x==="B").length;
let player=history.filter(x=>x==="P").length;
let result=banker>player?"閒":"莊";
document.getElementById("predict").innerText="下一局預測："+result;
}

function reset(){
history=[];
draw();
document.getElementById("predict").innerText="下一局預測：-";
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>百家老師 AI</title>

<style>

body{
background:#000c2e;
color:white;
text-align:center;
font-family:sans-serif;
}

button{
padding:15px 30px;
margin:10px;
font-size:20px;
border:none;
border-radius:10px;
}

.banker{
background:#ef4444;
color:white;
}

.player{
background:#3b82f6;
color:white;
}

#road{
margin-top:20px;
}

.dot{
display:inline-block;
width:20px;
height:20px;
border-radius:50%;
margin:4px;
}

.red{
background:red;
}

.blue{
background:blue;
}

</style>

</head>

<body>

<h1>百家老師 AI</h1>

<input type="file" accept="image/*" onchange="preview(event)">

<br><br>

<img id="img" width="300">

<br><br>

<button class="banker" onclick="add('B')">莊</button>
<button class="player" onclick="add('P')">閒</button>

<br>

<button onclick="reset()">重置</button>

<h2>大路</h2>

<div id="road"></div>

<h2 id="predict">下一局預測：-</h2>

<script>

let history=[];

function preview(e){

let img=document.getElementById("img");
img.src=URL.createObjectURL(e.target.files[0]);

}

function add(x){

history.push(x);

draw();

}

function draw(){

let road=document.getElementById("road");

road.innerHTML="";

history.forEach(h=>{

let d=document.createElement("div");

d.className="dot "+(h=="B"?"red":"blue");

road.appendChild(d);

});

predict();

}

function predict(){

if(history.length<2){

document.getElementById("predict").innerText="下一局預測：-";

return;

}

let last=history[history.length-1];
let prev=history[history.length-2];

if(last==prev){

document.getElementById("predict").innerText=
"下一局預測："+(last=="B"?"莊":"閒");

}else{

document.getElementById("predict").innerText=
"下一局預測："+(last=="B"?"閒":"莊");

}

}

function reset(){

history=[];

draw();

}

</script>

</body>
</html>
